# DO NOT EDIT — managed by hugoh/go-tools via copier.
---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        type: choice
        description: "Version bump type"
        default: auto
        options: [auto, patch, minor, major]
      version:
        type: string
        description: "Release exactly this version, such as 5.0.0-rc.1 (a version with a suffix is a pre-release); overrides bump_type"
        default: ""
      dry_run:
        type: boolean
        description: "Rehearse the release (bump and validate) without pushing the tag or publishing; allowed on any branch"
        default: false

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs; never cancel a push-to-main run mid-release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hk:
    uses: hugoh/go-tools/.github/workflows/go-hk.yml@1060072de74a95c0005f5d80e028e89e400525e1 # v1.34.2
    permissions:
      contents: read

  goci:
    uses: hugoh/go-tools/.github/workflows/go-ci.yml@1060072de74a95c0005f5d80e028e89e400525e1 # v1.34.2
    permissions:
      contents: read

  # The single required status check, and all that pages/release wait on.
  # Add any new job that must pass to `needs`; downstream jobs stay out of it.
  ci-gate:
    if: always()
    needs: [hk, goci]
    timeout-minutes: 2
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}

  release:
    needs: ci-gate
    uses: hugoh/go-tools/.github/workflows/go-release.yml@1060072de74a95c0005f5d80e028e89e400525e1 # v1.34.2
    permissions:
      contents: write
    with:
      bump_type: ${{ inputs.bump_type || 'auto' }}
      version: ${{ inputs.version || '' }}
      dry_run: ${{ inputs.dry_run || false }}
      has_goreleaser: true
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      tap_github_token: ${{ secrets.TAP_GITHUB_TOKEN }}
      cloudsmith_api_key: ${{ secrets.CLOUDSMITH_API_KEY }}
