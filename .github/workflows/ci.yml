---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        type: choice
        description: "Version bump type"
        default: auto
        options: [auto, patch, minor, major]

permissions: {}

jobs:
  hk:
    uses: hugoh/go-tools/.github/workflows/go-hk.yml@bdd065fcc30fd65722922bf6384fb16c161db79d # v1.26.26
    permissions:
      contents: read

  goci:
    uses: hugoh/go-tools/.github/workflows/go-ci.yml@bdd065fcc30fd65722922bf6384fb16c161db79d # v1.26.26
    permissions:
      contents: read

  release:
    needs: [hk, goci]
    uses: hugoh/go-tools/.github/workflows/go-release.yml@bdd065fcc30fd65722922bf6384fb16c161db79d # v1.26.26
    permissions:
      contents: write
    with:
      bump_type: ${{ inputs.bump_type || 'auto' }}
      has_goreleaser: true
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      tap_github_token: ${{ secrets.TAP_GITHUB_TOKEN }}
